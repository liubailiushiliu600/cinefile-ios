name: Build Cinefile IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid cocoapods

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install pods (MobileVLCKit)
        run: pod install --repo-update

      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Cinefile.xcworkspace \
            -scheme Cinefile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cinefile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Cinefile.xcarchive/Products/Applications/Cinefile.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          # Prebuilt frameworks (FFmpegKit) ship their own _CodeSignature; ldid
          # re-signing the binary afterwards makes the bundle inconsistent and
          # dyld refuses to load it. Drop the stale signature first.
          find "Payload/Cinefile.app" -maxdepth 4 -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          # Pre-sign every Mach-O (app + embedded frameworks) so TrollStore
          # installs a consistent bundle and MobileVLCKit loads.
          if [ -f "$GITHUB_WORKSPACE/Cinefile.entitlements" ]; then
            ldid -S"$GITHUB_WORKSPACE/Cinefile.entitlements" "Payload/Cinefile.app/Cinefile" || true
          else
            ldid -S "Payload/Cinefile.app/Cinefile" || true
          fi
          find "Payload/Cinefile.app" -maxdepth 4 -name "*.framework" | while read -r fw; do
            name=$(basename "$fw" .framework)
            if [ -f "$fw/$name" ]; then ldid -S "$fw/$name" || true; fi
          done
          find "Payload/Cinefile.app" -maxdepth 4 -name "*.dylib" | while read -r lib; do
            ldid -S "$lib" || true
          done

          # Fail the build if the app links an @rpath framework that was not
          # embedded — that is exactly what makes TrollStore installs crash on
          # launch (dyld: Library not loaded).
          echo "--- embedded framework check ---"
          MISSING=0
          for dep in $(otool -L "Payload/Cinefile.app/Cinefile" | grep -o '@rpath/[^ ]*' | sort -u); do
            rel="${dep#@rpath/}"
            if [ -f "Payload/Cinefile.app/Frameworks/$rel" ]; then
              echo "OK: $dep"
            else
              echo "MISSING: $dep"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: linked frameworks are not embedded; refusing to package"
            exit 1
          fi

          zip -qry Cinefile-unsigned.ipa Payload
          ls -lh Cinefile-unsigned.ipa
          du -sh "Payload/Cinefile.app"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cinefile-unsigned-ipa
          path: ${{ runner.temp }}/Cinefile-unsigned.ipa
          if-no-files-found: error
