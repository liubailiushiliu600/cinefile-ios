name: Cinefile
options:
  bundleIdPrefix: app.cinefile
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  Cinefile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Cinefile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cinefile.ios
        PRODUCT_NAME: Cinefile
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Cinefile/App/Info.plist
      properties:
        CFBundleDisplayName: Cinefile
        CFBundleName: Cinefile
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: "Cinefile 需要本地网络权限，用于发现附近设备、连接 SMB 共享与传输文件。"
        NSBonjourServices:
          - _cinefile._tcp
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  Cinefile:
    build:
      targets:
        Cinefile: all
    run:
      config: Debug
    archive:
      config: Release
